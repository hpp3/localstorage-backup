<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background: rounded square -->
  <rect width="128" height="128" rx="22" fill="#1a73e8"/>

  <!-- Cloud: big central circle + side humps + flat base -->
  <g fill="#ffffff">
    <circle cx="64" cy="52" r="26"/>
    <circle cx="40" cy="62" r="16"/>
    <circle cx="88" cy="62" r="16"/>
    <rect x="30" y="62" width="68" height="22" rx="8"/>
  </g>

  <!-- Up arrow (blue cutout inside cloud): backup = upload to Drive -->
  <path fill="#1a73e8" d="
    M 64 40
    L 46 60
    L 56 60
    L 56 78
    L 72 78
    L 72 60
    L 82 60
    Z"/>
</svg>
